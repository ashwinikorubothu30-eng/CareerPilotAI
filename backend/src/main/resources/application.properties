server.port=8080

# Application Configuration
spring.application.name=CareerPilotAI

# H2 In-Memory Database (Zero config, runs immediately)
spring.datasource.url=jdbc:h2:mem:careerpilotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MySQL Database Alternative (Uncomment to use MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/careerpilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Optional AI Configuration (Ollama / Local or Cloud LLM hooks)
careerpilot.ai.provider=embedded
careerpilot.ai.ollama.url=http://localhost:11434
careerpilot.ai.ollama.model=llama3

